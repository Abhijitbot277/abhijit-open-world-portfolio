<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080b" />
    <title>Abhijit — Open World Portfolio</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050609; }
      #root { width: 100%; height: 100%; }
      #cinematic-login {
        position: fixed; inset: 0; z-index: 9999; overflow: hidden;
        display: flex; align-items: flex-end; justify-content: center;
        padding: 7vh 6vw 9vh;
        color: #fff; font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, rgba(3,4,7,.18) 0%, rgba(3,4,7,.12) 42%, rgba(3,4,7,.88) 100%);
        transition: opacity 1.1s ease, visibility 1.1s ease;
      }
      #cinematic-login::before {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 50% 52%, transparent 0 28%, rgba(0,0,0,.28) 72%, rgba(0,0,0,.72) 100%);
      }
      .login-noise { position:absolute; inset:0; opacity:.055; pointer-events:none; background-image: repeating-linear-gradient(0deg, transparent 0 3px, #fff 4px); mix-blend-mode:overlay; }
      .login-content { position:relative; width:min(100%, 1100px); text-align:center; animation: loginRise 1.6s cubic-bezier(.2,.8,.2,1) both; }
      .login-kicker { letter-spacing:.42em; font-size:11px; color:#d7b56a; font-weight:700; margin-bottom:18px; text-shadow:0 2px 14px #000; }
      .login-title { margin:0; font-size:clamp(54px, 10vw, 132px); line-height:.86; letter-spacing:-.055em; font-weight:900; text-transform:uppercase; text-shadow:0 8px 35px rgba(0,0,0,.85), 0 0 32px rgba(214,171,77,.12); }
      .login-subtitle { margin:22px 0 34px; font-size:clamp(12px, 1.5vw, 17px); letter-spacing:.32em; color:rgba(255,255,255,.72); text-transform:uppercase; }
      .login-button {
        border:1px solid rgba(235,202,127,.75); background:rgba(7,8,11,.7); color:#f7dfaa;
        padding:16px 42px; min-width:230px; cursor:pointer; font-size:12px; font-weight:800; letter-spacing:.28em;
        text-transform:uppercase; backdrop-filter:blur(12px); box-shadow:0 12px 45px rgba(0,0,0,.45), inset 0 0 24px rgba(219,177,77,.06);
        transition:transform .25s ease, background .25s ease, box-shadow .25s ease;
      }
      .login-button:hover { transform:translateY(-3px) scale(1.02); background:rgba(219,177,77,.14); box-shadow:0 18px 55px rgba(0,0,0,.6), 0 0 28px rgba(219,177,77,.12); }
      .login-hint { margin-top:18px; font-size:10px; color:rgba(255,255,255,.42); letter-spacing:.22em; text-transform:uppercase; }
      .login-corner { position:absolute; top:28px; left:32px; right:32px; display:flex; justify-content:space-between; color:rgba(255,255,255,.42); font-size:9px; letter-spacing:.2em; text-transform:uppercase; }
      .login-corner strong { color:#d7b56a; }
      .login-progress { position:absolute; bottom:24px; left:50%; width:min(360px,48vw); height:2px; transform:translateX(-50%); background:rgba(255,255,255,.12); overflow:hidden; }
      .login-progress::after { content:''; display:block; height:100%; width:34%; background:#d7b56a; animation: scan 2.2s ease-in-out infinite; }
      #cinematic-login.hidden { opacity:0; visibility:hidden; pointer-events:none; }
      @keyframes loginRise { from { opacity:0; transform:translateY(42px) scale(1.025); } to { opacity:1; transform:none; } }
      @keyframes scan { 0%,100% { transform:translateX(-120%); } 50% { transform:translateX(340%); } }
      @media (max-width:700px) { #cinematic-login { padding-bottom:12vh; } .login-corner { top:18px; left:18px; right:18px; } .login-subtitle { letter-spacing:.16em; } .login-button { min-width:200px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="cinematic-login" aria-label="Abhijit Open World introduction">
      <div class="login-noise"></div>
      <div class="login-corner"><span>ABHIJIT CITY // 01</span><span><strong>OPEN WORLD</strong> &nbsp; ONLINE</span></div>
      <div class="login-content">
        <div class="login-kicker">WELCOME TO THE WORLD OF</div>
        <h1 class="login-title">ABHIJIT<br>SINGHA</h1>
        <div class="login-subtitle">AI • SOFTWARE • CREATIVE TECHNOLOGY</div>
        <button class="login-button" id="enter-city">ENTER CITY</button>
        <div class="login-hint">PRESS ENTER TO START &nbsp; • &nbsp; EXPLORE THE DEVELOPER</div>
      </div>
      <div class="login-progress"></div>
    </div>

    <script>
      (function () {
        const screen = document.getElementById('cinematic-login');
        const button = document.getElementById('enter-city');
        let entered = false;
        function enterCity() {
          if (entered) return;
          entered = true;
          screen.classList.add('hidden');
          setTimeout(() => screen.remove(), 1200);
        }
        button.addEventListener('click', enterCity);
        window.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') enterCity();
        });
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
